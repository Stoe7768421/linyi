<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>权属信息页面</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
}
body{
    background-color: #ffffff;
    color: #111;
}
/* 顶部标签 */
.tab-header{
    display: flex;
    border-bottom: 1px solid #e6e8ed;
}
.tab-item{
    padding: 10px 22px;
    font-size: 17px;
    cursor: pointer;
    position: relative;
}
.tab-item.active{
    color: #3478e8;
}
.tab-item.active::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-1px;
    width:100%;
    height:3px;
    background:#3478e8;
}
/* 滑动容器 */
.tab-wrap{
    width:100%;
    overflow:hidden;
}
.tab-container{
    display:flex;
    transition: transform 0.32s ease;
}
.tab-panel{
    min-width:100%;
    padding:12px;
}
/* 图片面板容器 */
.image-wrap{
    width:100%;
    min-height:620px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
}
.image-wrap img{
    max-width:100%;
}
/* 权属表格 精准复刻原图列宽、布局 */
.info-table{
    width:100%;
    border-collapse: collapse;
    font-size:17px;
}
.info-table td{
    padding:18px 12px;
    vertical-align: middle;
    border: 1px solid #f0f2f8;
}
/* 第一列：大分类【房屋状况/证书是否有效/土地状况】加宽 */
.info-table td.col-category{
    width: 160px;
    text-align:right;
    font-weight:500;
}
/* 标签列：权证号、权利人等 */
.info-table td.col-label{
    width: 140px;
    text-align:right;
}
/* 内容单元格：文字居中 */
.info-table td.col-val{
    text-align:center;
}
</style>
</head>
<body>

<div class="tab-header">
    <div class="tab-item" data-index="0">分户图</div>
    <div class="tab-item" data-index="1">宗地图</div>
    <div class="tab-item active" data-index="2">权属状态</div>
</div>

<div class="tab-wrap">
    <div class="tab-container" id="slideBox">
        <!-- 分户图面板 -->
        <div class="tab-panel">
            <div class="image-wrap">
                <img src="1.jpg" alt="分户图">
            </div>
        </div>
        <!-- 宗地图面板 -->
        <div class="tab-panel">
            <div class="image-wrap">
                <img src="2.jpg" alt="宗地图">
            </div>
        </div>
        <!-- 权属状态表格【完全匹配截图行列合并与宽度】 -->
        <div class="tab-panel">
            <table class="info-table">
                <tr>
                    <td rowspan="6" class="col-category">房屋状况</td>
                    <td class="col-label">权证号</td>
                    <td class="col-val" colspan="3">鲁(2025)临沂市不动产权第0037757号</td>
                </tr>
                <tr>
                    <td class="col-label">权利人</td>
                    <td class="col-val" colspan="3">胡文娜,唐艺铨</td>
                </tr>
                <tr>
                    <td class="col-label">共有方式</td>
                    <td class="col-val" colspan="3">共同共有</td>
                </tr>
                <tr>
                    <td class="col-label">坐落</td>
                    <td class="col-val" colspan="3">兰山区北城新区三和社区A区(润园)15号楼2-501</td>
                </tr>
                <tr>
                    <td class="col-label">用途</td>
                    <td class="col-val" colspan="3">城镇住宅用地/住宅</td>
                </tr>
                <tr>
                    <td class="col-label">建筑面积</td>
                    <td class="col-val" colspan="3">共有宗地面积: 62129㎡/房屋建筑面积:202.75㎡</td>
                </tr>
                <tr>
                    <td></td>
                    <td class="col-label">抵押登记</td>
                    <td class="col-val">否</td>
                    <td class="col-label">查封登记</td>
                    <td class="col-val">否</td>
                </tr>
                <tr>
                    <td></td>
                    <td class="col-label">异议登记</td>
                    <td class="col-val">否</td>
                    <td class="col-label">限制登记</td>
                    <td class="col-val">否</td>
                </tr>
                <tr>
                    <td class="col-category">证书是否有效</td>
                    <td class="col-val" colspan="4">有效</td>
                </tr>
                <tr>
                    <td rowspan="2" class="col-category">土地状况</td>
                    <td class="col-label">权利性质</td>
                    <td class="col-val" colspan="3">出让/市场化商品房</td>
                </tr>
                <tr>
                    <td class="col-label">使用期限</td>
                    <td class="col-val" colspan="3">2007年12月28日起2077年12月27日止</td>
                </tr>
            </table>
        </div>
    </div>
</div>

<script>
// 标签点击切换
const tabs = document.querySelectorAll('.tab-item');
const slideBox = document.getElementById('slideBox');
tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
        let idx = tab.dataset.index;
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        slideBox.style.transform = `translateX(-${idx * 100}%)`;
    })
})

// 触屏左右滑动支持
let startX = 0;
let moveX = 0;
let currentIndex = 2;
const panelWrap = document.querySelector('.tab-wrap');
panelWrap.addEventListener('touchstart',e=>{
    startX = e.touches[0].clientX;
})
panelWrap.addEventListener('touchmove',e=>{
    moveX = e.touches[0].clientX;
})
panelWrap.addEventListener('touchend',()=>{
    let diff = moveX - startX;
    if(Math.abs(diff)>60){
        if(diff>0 && currentIndex>0){
            currentIndex--;
        }else if(diff<0 && currentIndex<2){
            currentIndex++;
        }
        tabs.forEach(t=>t.classList.remove('active'));
        tabs[currentIndex].classList.add('active');
        slideBox.style.transform = `translateX(-${currentIndex*100}%)`;
    }
})
</script>
</body>
</html>
